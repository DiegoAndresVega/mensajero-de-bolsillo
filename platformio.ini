[platformio]
default_envs = waveshare_esp32_s3_zero

; Base comun: placa real y Wokwi comparten todo salvo el puerto serie de debug.
[esp32s3_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = waveshare_esp32_s3_zero
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  lovyan03/LovyanGFX@^1.2.30
  ; ESP32-audioI2S no va aqui: es una copia parcheada (solo MP3 y WAV) en
  ; lib/esp32-audioI2S-patched/, que PlatformIO compila sola al ver #include <Audio.h>.
  ; Ver lib/esp32-audioI2S-patched/PARCHE.md
build_flags =
  -DBOARD_HAS_PSRAM
  ; ESP32-audioI2S lo exige. 1 (solo errores) es el nivel que el core ya usa por defecto
  -DCORE_DEBUG_LEVEL=1

; Placa real: el S3-Zero solo expone USB nativo, asi que el debug va por USB CDC.
[env:waveshare_esp32_s3_zero]
extends = esp32s3_base
build_flags =
  ${esp32s3_base.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
; Sonido de notificacion por defecto (tools/sonido/preparar.sh), que copia
; src/default_sounds.cpp si la SD no trae uno.
board_build.embed_files =
  assets/sonidos/notificacion.mp3
; Traduce el backtrace de un Guru Meditation a funciones y lineas
monitor_filters = esp32_exception_decoder

; Simulacion: debug por UART0 (Serial0) y config de respaldo si la SD no trae config.json.
[env:wokwi]
extends = esp32s3_base
build_flags =
  ${esp32s3_base.build_flags}
  -DWOKWI_BUILD

; Tests de logica pura en el ordenador: pio test -e native
[env:native]
platform = native
test_build_src = no
; La misma ArduinoJson de la placa: wifi_rules.h la usa para leer config.json
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -std=c++17
  -Isrc
